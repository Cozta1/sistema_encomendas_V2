<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Encomendas</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  </head>
  <body>
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        // Se o tema salvo for explicitamente 'light', adiciona a classe.
        // Se for 'dark' ou nulo/ausente, não faz nada (pois dark é o padrão CSS).
        if (theme === 'light') {
          document.body.classList.add('light-mode');
        }
      })();
    </script>
    <div id="root"></div> <script type="module" src="/src/main.jsx"></script> </body>
</html>
